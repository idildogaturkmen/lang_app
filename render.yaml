services:
  - type: web
    name: lang_app
    env: python
    plan: standard
    buildCommand: |
      pip install --no-cache-dir --upgrade pip &&
      pip install --no-cache-dir -r requirements.txt &&
      echo "Build completed successfully"
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE  
        value: "1"
      
      # Secret key for Flask sessions
      - key: SECRET_KEY
        generateValue: true
      
      # Port configuration (Render will set PORT automatically)
      - key: STREAMLIT_PORT
        value: "8501"
      - key: AUTH_PORT
        value: "5001"
      
      # Basic threading limits
      - key: OMP_NUM_THREADS
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "2"
      
      # Streamlit optimizations
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "10"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: "none"
      
      # Cache optimizations
      - key: TORCH_HOME
        value: "/tmp/torch"
        
      # Database configuration
      - key: DATABASE_PATH
        value: "language_learning.db"