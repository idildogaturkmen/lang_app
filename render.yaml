services:
  - type: web
    name: lang_app
    env: python
    plan: standard  # Since you mentioned you're using Standard plan
    buildCommand: |
      pip install --no-cache-dir --upgrade pip &&
      pip install --no-cache-dir -r requirements.txt &&
      echo "Build completed successfully"
    startCommand: streamlit run main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none --browser.gatherUsageStats false --server.maxUploadSize 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE  
        value: "1"
      
      # Basic OpenMP/BLAS threading limits
      - key: OMP_NUM_THREADS
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "2"
      
      # Streamlit optimizations
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "10"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: "none"
      
      # Cache optimizations
      - key: TORCH_HOME
        value: "/tmp/torch"